name: Personal dotfiles rehearsal

on:
  pull_request:
    paths: ['portable-linux/**', 'AGENTS.md', '.github/workflows/portable-linux.yml']
  push:
    paths: ['portable-linux/**', 'AGENTS.md', '.github/workflows/portable-linux.yml']

permissions:
  contents: read

jobs:
  linux-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools only in disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh vim git tmux ripgrep jq fzf
      - name: Static shell and JSON validation
        run: |
          zsh -n portable-linux/files/zshrc
          python3 -m json.tool portable-linux/manifest.json > /dev/null
          python3 -m json.tool portable-linux/profile-manifest.json > /dev/null
      - name: Offline target-HOME and recovery tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s portable-linux/tests -v
